        />

<body class="d-flex">
     <nav class="navbar navbar-expand flex-column navbar-dimensions bg-green">
        <div class="container-fluid justify-content-center mt-3">
            <p class="fw-bold fs-4">Grocer!</p>
        </div>
        <hr>
        <div class="container-fluid flex-column mb-auto" id="navbarNav">
            <ul class="navbar-nav flex-column">
                <li class="nav-item text-white fw-bold">
                    <a class="nav-link" href="/groceryHome/groceryListHome.html">Home</a>
                </li>
                <li class="nav-item text-black fw-bold">
                    <a class="nav-link" href="/groceryDeals/groceryDeals.html">Items On Sale</a>
                </li>
                <li class="nav-item text-black fw-bold">
                    <a class="nav-link" href="/nearbyStores/nearbyStores.html">Stores Near You</a>
                </li>
                <li class="nav-item text-black fw-bold">
                    <a class="nav-link" href="/aboutUs.html">About</a>
                </li>
            </ul>
        </div>
        <div class="container-fluid flex-column mb-4">
            <a class="nav-link fw-bold" href="../login.html">Logout</a>
        </div>
    </nav>

    <section class="main_content ms-5" id="main_content">

        <div class="d-flex m-5 flex-column border-bottom">
            <h1>Grocery Lists</h1>
            <p>Manage your grocery lists</p>
        </div>

        <div class="d-flex">
            <div id="grocery-form" class="form-div w-25 ms-5">
                <form class="">
                    <div class="form-group my-2">
                        <label for="exampleInputEmail1">Grocery List Name</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Grocery List Name">
                    </div>
                    <div class="form-group row m-auto my-2">
                        <label class="col" for="item-name">Item</label>
                        <div style="width: 1rem;"></div>
                        <label class="col" for="quantity">Quantity</label>
                        <div class="w-100"></div>
                        <input type="text" class="form-control col" id="ingredient-name" placeholder="Ingredient Name">
                        <div style="width: 1rem;"></div>
                        <input type="text" class="form-control col" id="quantity" placeholder="Quantity">
                    </div>
                    <div class="d-flex flex-column my-4">
                        <button type="button" onclick="addIngredientToList()" class="btn btn-primary w-25">Add Items</button>
                        <button class="btn btn-primary w-25 my-2">Submit</button>
                    </div>

                </form>
            </div>

            <div class="w-50" id="grocery-list-div">
                <ul id="ingredient-list" class="list-group  w-100 mt-4">
                    <li class="list-group-item mx-5 px-4 py-3 fw-bold d-flex flex-row">
                        <p>Oranges</p>
                        <p class="ms_fill_ingredient_li">Quantity: 1</p>
                    </li>
                    <li class="list-group-item mx-5 px-4 py-3 fw-bold d-flex flex-row">
                        <p>Apples</p>
                        <p class="ms_fill_ingredient_li">Quantity: 1</p>
                    </li>
                </ul>
            </div>

        </div>

        </section>

        <div id="list items">

        </div>

        <script
        src="groceryListView.js">
        </script>

        <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    </section>
</body>
</html>
