<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Items on Sale</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- External CSS -->
        <link rel="stylesheet" href="groceryDeals.css" />
    </head>

    <body>
        <div class="container py-5">
            <h2 class="section-title">Items on Sale</h2>
            <p class="text-muted">Check out the best deals near you</p>

            <div class="row g-4">
                <!-- Apples -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">33% OFF</div>

                        <div class="card-body">
                            <h5>Apples</h5>
                            <div class="store">Fresh Market</div>

                            <div class="mt-3">
                                <span class="price">$3.99</span>
                                <span class="old-price">$5.99</span>
                            </div>

                            <button class="btn btn-add w-100 mt-4 text-white">
                                Add to List
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Milk -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">33% OFF</div>

                        <div class="card-body">
                            <h5>Milk</h5>
                            <div class="store">Grocery Plus</div>

                            <div class="mt-3">
                                <span class="price">$2.99</span>
                                <span class="old-price">$4.49</span>
                            </div>

                            <button class="btn btn-add w-100 mt-4 text-white">
                                Add to List
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Bread -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">38% OFF</div>

                        <div class="card-body">
                            <h5>Bread</h5>
                            <div class="store">Baker's Corner</div>

                            <div class="mt-3">
                                <span class="price">$2.49</span>
                                <span class="old-price">$3.99</span>
                            </div>

                            <button class="btn btn-add w-100 mt-4 text-white">
                                Add to List
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
