<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Items on Sale</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link href="groceryDeals.css" rel="stylesheet" />
    </head>

    <body>
        <div class="container py-5">
            <h2 class="fw-bold mb-1">Items on Sale</h2>
            <p class="text-muted mb-4">Check out the best deals near you</p>

            <div class="row g-4">
                <!-- Apples -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">50% OFF</div>
                        <div class="card-body">
                            <h5>Apples</h5>
                            <div class="store">Fresh Market</div>

                            <div class="mt-3">
                                <span class="price">$3.49</span>
                                <span class="old-price">$6.99</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>

                <!-- Milk -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">33% OFF</div>
                        <div class="card-body">
                            <h5>Milk</h5>
                            <div class="store">Grocery Plus</div>

                            <div class="mt-3">
                                <span class="price">$2.99</span>
                                <span class="old-price">$4.49</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>

                <!-- Bread -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">38% OFF</div>
                        <div class="card-body">
                            <h5>Bread</h5>
                            <div class="store">Baker's Corner</div>

                            <div class="mt-3">
                                <span class="price">$2.49</span>
                                <span class="old-price">$3.99</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>

                <!-- Chicken -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">31% OFF</div>
                        <div class="card-body">
                            <h5>Chicken Breast</h5>
                            <div class="store">Fresh Market</div>

                            <div class="mt-3">
                                <span class="price">$8.99</span>
                                <span class="old-price">$12.99</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>

                <!-- Oranges -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">29% OFF</div>
                        <div class="card-body">
                            <h5>Oranges</h5>
                            <div class="store">Grocery Plus</div>

                            <div class="mt-3">
                                <span class="price">$4.99</span>
                                <span class="old-price">$6.99</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>

                <!-- Yogurt -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="discount-bar">33% OFF</div>
                        <div class="card-body">
                            <h5>Yogurt</h5>
                            <div class="store">Dairy Delight</div>

                            <div class="mt-3">
                                <span class="price">$3.99</span>
                                <span class="old-price">$5.99</span>
                            </div>

                            <button class="add-btn">View Store</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
