<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link
            rel="stylesheet"
            type="text/css"
            media="screen"
            href="css/bootstrap.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            media="screen"
            href="css/custom.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            media="screen"
            href="css/login.css"
        />
    </head>
    <body>
        <div class="login-wrapper">
            <div class="login-left">
                <img
                    src="assets/logo.png"
                    alt="Grocery Logo"
                    style="width: 80px; margin-bottom: 1.5rem"
                />
                <h1>Login</h1>
                <div class="login-form">
                    <button class="social-btn">Continue with Google</button>
                    <button class="social-btn">Continue with Apple</button>

                    <hr class="divider" />

                    <label class="form-label" for="email">Email address</label>
                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                    />

                    <label class="form-label" for="password">Password</label>
                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                    />

                    <a
                        class="login-btn"
                        type="submit"
                        href="groceryHome/groceryListHome.html"
                    >
                        Login
                    </a>

                    <p class="create-account-text">
                        Don't have an account?
                        <a href="register.html" class="create-account-link"
                            >Create account</a
                        >
                    </p>
                </div>
            </div>

            <div class="login-right">
                <img
                    src="assets/login-image.jpg"
                    alt="Fresh groceries"
                    class="login-right-img"
                    style="width: 100%; height: 100%; object-fit: cover"
                />
            </div>
        </div>
    </body>
</html>
